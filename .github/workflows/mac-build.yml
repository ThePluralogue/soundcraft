name: Mac build

# A one-off macOS build of a working branch: the universal (Apple silicon + Intel) DMG for macOS 11
# Big Sur and later, ad-hoc signed (not notarized), uploaded as a workflow artifact. Nothing is
# released. Mirrors the macOS job in craft-common-actions release.yml without the signing secrets.
on:
  push:
    branches: ["mac-build/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS universal (unsigned)
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: step-security/rust-cache@851174d9a2fdc03e0896e02844dcc61d81dd7851 # v2.9.1
        with:
          key: mac-build-universal
      - name: Build and package (ad-hoc signed)
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soundcraft-macos-universal
          path: dist/release/*
          if-no-files-found: error
